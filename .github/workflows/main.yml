name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Install backend dependencies
        run: make install

      - name: Run backend linter
        run: make lint

      - name: Run backend tests
        run: make test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create Yandex Cloud IAM token
        if: github.event_name == 'push'
        id: iam-token
        uses: yc-actions/yc-iam-token@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Log in to Yandex Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.iam-token.outputs.token }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ github.event_name == 'push' && format('cr.yandex/{0}/project-devops-deploy:latest', vars.YC_REGISTRY_ID) || format('project-devops-deploy:{0}', github.sha) }}
            ${{ github.event_name == 'push' && format('cr.yandex/{0}/project-devops-deploy:{1}', vars.YC_REGISTRY_ID, github.sha) || '' }}
